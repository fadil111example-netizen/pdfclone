name: APK

# Builds the debug and release APK on every push / pull request and publishes
# them as downloadable workflow artifacts. Nothing is uploaded anywhere else:
# the whole pipeline runs on GitHub's throwaway runner.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Report toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} artifacts/ \;
          ls -l artifacts

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumina-pdf-apk
          path: artifacts/*.apk
          if-no-files-found: warn
          retention-days: 30
